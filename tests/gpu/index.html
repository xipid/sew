<!DOCTYPE html>
<html>
<head>
    <title>GLFW WASM Event Test</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #555;
            background: #222;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        #console-log {
            margin-top: 15px;
            width: 640px;
            height: 100px;
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            overflow-y: auto;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>GLFW 3 WASM Input Test</h1>
    <p>Click on the canvas below and press keys or move your mouse. Press <strong>ESC</strong> to terminate.</p>
    
    <!-- This canvas will be associated with our GLFWwindow handle -->
    <canvas id="myCustomCanvas" width="640" height="480"></canvas>
    
    <div id="console-log">Console output will appear here...</div>

    <script type="module">
        import { init, getExports } from "./index.js";

        // Intercept standard console output to display directly in the UI
        const consoleLog = document.getElementById("console-log");
        const originalLog = console.log;
        console.log = function (message) {
            originalLog.apply(console, arguments);
            const line = document.createElement("div");
            line.textContent = message;
            consoleLog.appendChild(line);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        };

        async function main() {
            // Load and initialize the WASM binary
            await init("./index.wasm", ["myCustomCanvas"]);
            const exports = getExports();
            if (exports._start) {
                exports._start();
            } else if (exports.main) {
                exports.main();
            }
        }
        main();
    </script>
</body>
</html>
