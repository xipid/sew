<!DOCTYPE html>
<html>
<head>
    <title>WebGPU Canvas Clear Animation</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #555;
            background: #000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <h1>WebGPU Clear Canvas Animation (C++ to WASM)</h1>
    <canvas id="myCustomCanvas" width="640" height="480"></canvas>

    <script type="module">
        import { init, getExports } from "./index.js";

        async function main() {
            await init("./index.wasm", ["myCustomCanvas"]);
            const exports = getExports();
            if (exports._start) {
                exports._start();
            } else if (exports.main) {
                exports.main();
            }
        }
        main();
    </script>
</body>
</html>
